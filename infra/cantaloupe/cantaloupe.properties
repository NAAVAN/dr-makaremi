# Cantaloupe Image Server Configuration for Dr. Hassan Makaremi Digital Gallery
# IIIF v2/v3 support

application.name = Cantaloupe
application.version = 5.0.6

# HTTP server settings
http.enabled = true
http.host = 0.0.0.0
http.port = 8182

# Base URI
base_uri = http://localhost:8182/

# Source settings
source.static = FilesystemSource
FilesystemSource.lookup_strategy = BasicLookupStrategy
FilesystemSource.BasicLookupStrategy.path_prefix = /var/images/
FilesystemSource.BasicLookupStrategy.path_suffix =

# Cache settings
cache.server.resolve_first = true
cache.server.derivative.enabled = true
cache.server.derivative = FilesystemCache
FilesystemCache.pathname = /var/cache/cantaloupe
FilesystemCache.dir.depth = 3
FilesystemCache.dir.name_length = 2
FilesystemCache.ttl = 2592000

# Processors
processor.fallback = Java2dProcessor
processor.image/jpeg = Java2dProcessor
processor.image/png = Java2dProcessor
processor.image/tiff = Java2dProcessor
processor.image/webp = Java2dProcessor

# Endpoint
# Security Hardening: Disable administrative control API unless explicitly bound to internal service mesh
endpoint.api.enabled = false
endpoint.api.secret = 
endpoint.iiif.2.enabled = true
endpoint.iiif.3.enabled = true
